<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨西哥旅行工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css?v=202611092211">
</head>
<body>
<div class="wrap" id="home">
  <header class="panel head">
    <div class="headT">
      <h1>墨西哥旅行</h1>
      <span class="stat" id="stat"></span>
    </div>
    <p class="sub">从墨西哥城（Ciudad de México）出发 · 点地点名字看交通、行程、美食和酒店</p>
    <div class="pills" id="pills" role="group" aria-label="筛选"></div>
  </header>

  <div id="list" style="display:grid;gap:18px"></div>

  <section class="mapbox" id="mapbox">
    <h2>地图总览</h2>
    <figure class="plate"><svg id="mapMX" role="img" aria-label="墨西哥全国地图：22 个地点的位置，可以放大看更多地点"></svg></figure>
    <div class="mapjump" role="group" aria-label="地图快速跳转"><button class="pill zb" data-mz="out" aria-label="缩小">−</button><button class="pill zb" data-mz="in" aria-label="放大">+</button><button class="pill" data-mz="all">全国</button><button class="pill" data-mz="near">墨城周边</button><button class="pill" data-mz="city">墨城市内</button><button class="pill" data-mz="yuc">尤卡坦半岛</button></div>
    <p class="note">放大能看到更多地点：点上面的按钮、点 +，或双指放大；点红点打开这个地点的攻略。</p>
  </section>

  <footer>
    <span>评分和评论数来自 Google 地图（2026 年 10 月 26 日查询），点地图图标会打开 Google 地图里的位置。</span>
    <span>封面照片来自维基共享资源（Wikimedia Commons）和 Flickr，作者和授权写在各地点的资料来源里。</span>
    <span>交通、路线、美食、酒店的内容在逐步补充中。营业时间和价格出发前以官网为准。</span>
    <span>© 2026 洁小妮 Janis · 欢迎分享网址；转载内容请先联系我。</span>
  </footer>
</div>
<div class="wrap" id="placeView" hidden></div>
<!-- 数据（按顺序加载）：地点 → 简介 → 攻略；最后是页面逻辑 -->
<script src="data/places.js?v=202611092211"></script>
<script src="data/intros.js?v=202611092211"></script>
<script src="data/guides.js?v=202611092211"></script>
<script src="js/app.js?v=202611092211"></script>
</body>
</html>
